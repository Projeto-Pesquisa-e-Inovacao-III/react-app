name: Continuous Integration

on: 
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [feat/workflows]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      - name: Using Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 20.x
      - name: run install dependencies and build
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
        run: |
          npm install
          npm run build

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/react-app:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/react-app:${{ github.sha }} .

      - name: Run container and smoke test
        run: |
          docker run -d --name react-app-ci -p 8080:80 ${{ secrets.DOCKER_USERNAME }}/react-app:latest
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Smoke test passed"
              exit 0
            fi

            if [ -z "$(docker ps -q -f name=react-app-ci -f status=running)" ]; then
              echo "Container stopped unexpectedly. Logs:"
              docker logs react-app-ci || true
              exit 1
            fi

            sleep 1
          done

          echo "Smoke test timed out. Logs:"
          docker logs react-app-ci || true
          exit 1

      - name: Cleanup container
        if: always()
        run: docker rm -f react-app-ci || true
      
      - name: login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/react-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/react-app:${{ github.sha }}

  deploy-aws:
    runs-on: ubuntu-latest
    needs: continuous-integration
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check active container via SSM
        env:
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
        run: |
          if [ -z "${AWS_INSTANCE_ID}" ]; then
            echo "Missing AWS_INSTANCE_ID secret"
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${AWS_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Check running Docker containers" \
            --parameters 'commands=["docker ps","docker ps --filter name=front-server"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command id: ${COMMAND_ID}"

          SUCCESS=false
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${AWS_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "SSM status: ${STATUS}"

            if [ "${STATUS}" = "Success" ]; then
              SUCCESS=true
              break
            fi

            if [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "TimedOut" ] || [ "${STATUS}" = "Failed" ]; then
              echo "SSM command failed. stderr:"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${AWS_INSTANCE_ID}" \
                --query "StandardErrorContent" \
                --output text || true
              exit 1
            fi

            sleep 2
          done

          if [ "${SUCCESS}" != "true" ]; then
            echo "SSM command did not finish in time"
            exit 1
          fi

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${AWS_INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text)

          echo "Remote docker output:"
          echo "${OUTPUT}"

          if ! echo "${OUTPUT}" | grep -q "front-server"; then
            echo "Container front-server not found running on the instance."
            exit 1
          fi

          echo "Container front-server is active."
      

      
          

  