name: Continuous Integration

on: 
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [feat/workflows]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      - name: Using Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 20.x
      - name: run install dependencies and build
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
        run: |
          npm install
          npm run build

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/react-app:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/react-app:${{ github.sha }} .

      - name: Run container and smoke test
        run: |
          docker run -d --name react-app-ci -p 8080:80 ${{ secrets.DOCKER_USERNAME }}/react-app:latest
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Smoke test passed"
              exit 0
            fi

            if [ -z "$(docker ps -q -f name=react-app-ci -f status=running)" ]; then
              echo "Container stopped unexpectedly. Logs:"
              docker logs react-app-ci || true
              exit 1
            fi

            sleep 1
          done

          echo "Smoke test timed out. Logs:"
          docker logs react-app-ci || true
          exit 1

      - name: Cleanup container
        if: always()
        run: docker rm -f react-app-ci || true
      
      - name: login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/react-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/react-app:${{ github.sha }}

      
          

  