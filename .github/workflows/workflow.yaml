name: Continuous Integration

on: 
  pull_request:
    branches: [ develop ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      - name: Using Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 20.x
      - name: run install dependencies and build
        run: |
          npm install
          npm run build

      - name: Build Docker image
        run: docker build -t react-app:ci .

      - name: Run container and smoke test
        run: |
          docker run -d --name react-app-ci -p 8080:80 react-app:ci
          curl --retry 10 --retry-delay 1 --retry-connrefused -f http://localhost:8080

      - name: Cleanup container
        if: always()
        run: docker rm -f react-app-ci || true

