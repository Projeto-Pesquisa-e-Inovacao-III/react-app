name: CI/CD

on: 
  push:
    branches: [ develop ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/react-app
    
    steps:
      - uses: actions/checkout@v3

      - name: Using Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: run install dependencies and build
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
        run: |
          npm install
          npm run build

      - name: Build Docker image for smoke test
        run: |
          docker build -t "$IMAGE_REPOSITORY:local-test" .

      - name: Run container and smoke test
        run: |
          docker run -d --name react-app-ci -p 8080:8080 "$IMAGE_REPOSITORY:local-test"
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Smoke test passed"
              exit 0
            fi

            if [ -z "$(docker ps -q -f name=react-app-ci -f status=running)" ]; then
              echo "Container stopped unexpectedly. Logs:"
              docker logs react-app-ci || true
              exit 1
            fi

            sleep 1
          done

          echo "Smoke test timed out. Logs:"
          docker logs react-app-ci || true
          exit 1

      - name: Cleanup container
        if: always()
        run: docker rm -f react-app-ci || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and Push Multi-Arch Docker image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$IMAGE_REPOSITORY:latest" \
            -t "$IMAGE_REPOSITORY:${{ github.sha }}" \
            --push .

  deploy-azure:
    runs-on: [self-hosted]
    if: github.ref == 'refs/heads/main'
    needs: continuous-integration
    steps:
      - name: Docker preflight
        run: |
          whoami
          docker version
          docker ps

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy Frontend on Azure
        env:
          APP_IMAGE: ${{ secrets.DOCKER_USERNAME }}/react-app:${{ github.sha }}
          CONTAINER_NAME: front-server
        run: |
          echo "Baixando a nova imagem..."
          sudo docker pull $APP_IMAGE

          echo "Parando o container antigo..."
          sudo docker stop $CONTAINER_NAME || true
          sudo docker rm $CONTAINER_NAME || true

          echo "Iniciando o novo container..."
          sudo docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            -p 3000:8080 \
            $APP_IMAGE
            
          echo "Deploy do Frontend concluído com sucesso!"
