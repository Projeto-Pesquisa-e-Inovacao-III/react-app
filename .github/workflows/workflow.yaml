name: CI/CD

on: 
  push:
    branches: [ main, develop ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/react-app
    
    steps:
      - uses: actions/checkout@v3
      - name: Using Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 20.x
      - name: run install dependencies and build
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
        run: |
          npm install
          npm run build

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_REPOSITORY:latest" .
          docker build -t "$IMAGE_REPOSITORY:${{ github.sha }}" .

      - name: Run container and smoke test
        run: |
          docker run -d --name react-app-ci -p 8080:8080 "$IMAGE_REPOSITORY:latest"
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Smoke test passed"
              exit 0
            fi

            if [ -z "$(docker ps -q -f name=react-app-ci -f status=running)" ]; then
              echo "Container stopped unexpectedly. Logs:"
              docker logs react-app-ci || true
              exit 1
            fi

            sleep 1
          done

          echo "Smoke test timed out. Logs:"
          docker logs react-app-ci || true
          exit 1

      - name: Cleanup container
        if: always()
        run: docker rm -f react-app-ci || true
      
      - name: login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push Docker image to Docker Hub
        run: |
          docker push "$IMAGE_REPOSITORY:latest"
          docker push "$IMAGE_REPOSITORY:${{ github.sha }}"

  deploy-aws:
    runs-on: ubuntu-latest
    needs: continuous-integration
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update machine via SSM
        env:
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
        run: bash .github/scripts/update_machine_via_ssm.sh

      - name: Deploy app via SSM
        env:
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          APP_IMAGE: ${{ secrets.DOCKER_USERNAME }}/react-app:${{ github.sha }}
        run: bash .github/scripts/deploy_front_via_ssm.sh
      

      
          

  