name: CI/CD

on: 
  push:
    branches: [ main, develop, feat/workflows ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/react-app
    
    steps:
      - uses: actions/checkout@v3
      - name: Using Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 20.x
      - name: run install dependencies and build
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
        run: |
          npm install
          npm run build

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_REPOSITORY:latest" .
          docker build -t "$IMAGE_REPOSITORY:${{ github.sha }}" .

      - name: Run container and smoke test
        run: |
          docker run -d --name react-app-ci -p 8080:8080 "$IMAGE_REPOSITORY:latest"
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Smoke test passed"
              exit 0
            fi

            if [ -z "$(docker ps -q -f name=react-app-ci -f status=running)" ]; then
              echo "Container stopped unexpectedly. Logs:"
              docker logs react-app-ci || true
              exit 1
            fi

            sleep 1
          done

          echo "Smoke test timed out. Logs:"
          docker logs react-app-ci || true
          exit 1

      - name: Cleanup container
        if: always()
        run: docker rm -f react-app-ci || true
      
      - name: login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push Docker image to Docker Hub
        run: |
          docker push "$IMAGE_REPOSITORY:latest"
          docker push "$IMAGE_REPOSITORY:${{ github.sha }}"

  deploy-runner:
    runs-on: [self-hosted]
    # if: github.ref == 'refs/heads/main'
    needs: continuous-integration
    steps:
      - uses: actions/checkout@v3
      - name: Docker preflight
        run: |
          whoami
          id
          groups
          ls -l /var/run/docker.sock || true
          docker version
          docker ps

      - name: Update machine
        timeout-minutes: 5
        run: bash .github/scripts/update_machine_via_ssm.sh

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy app
        timeout-minutes: 5
        env:
          APP_IMAGE: ${{ secrets.DOCKER_USERNAME }}/react-app:${{ github.sha }}
          CONTAINER_NAME: front-server
          HOST_PORT: "80"
          CONTAINER_PORT: "8080"
          HEALTHCHECK_URL: http://localhost/
          HEALTHCHECK_MAX_RETRIES: "30"
          HEALTHCHECK_INTERVAL_SECONDS: "2"
        run: bash .github/scripts/deploy_front_via_ssm.sh
      

      
          

  